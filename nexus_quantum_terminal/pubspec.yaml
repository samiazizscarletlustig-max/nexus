name: nexus_quantum_terminal
description: NEXUS Quantum Terminal — OLED Bloomberg-style client for Android & Windows (FastAPI backend).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  syncfusion_flutter_charts: ^27.2.5
  fl_chart: ^0.71.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
